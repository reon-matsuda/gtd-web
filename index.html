<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAS 疎通テスト</title>
<style>
  :root{ color-scheme: light; }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:16px; background:#f4f5f7; color:#1e293b;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:14px; line-height:1.7; }
  .wrap{ max-width:760px; margin:0 auto; }
  h1{ font-size:18px; margin:0 0 4px; }
  .lead{ color:#64748b; font-size:13px; margin:0 0 16px; }
  .card{ background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px; }
  input{ width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:9px 10px; font-size:13px;
    background:#fff; margin-bottom:10px; }
  button{ border:0; border-radius:8px; padding:11px 16px; font-size:14px; font-weight:600;
    background:#4f46e5; color:#fff; cursor:pointer; }
  button:disabled{ background:#c7d2fe; cursor:default; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .res{ margin-top:12px; }
  .t{ border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .t b{ display:block; font-size:13px; margin-bottom:2px; }
  .ok{ border-color:#86efac; background:#f0fdf4; }
  .ng{ border-color:#fca5a5; background:#fef2f2; }
  .wait{ border-color:#fcd34d; background:#fffbeb; }
  .msg{ font-size:12px; color:#475569; word-break:break-all; }
  pre{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px;
    font-size:11px; overflow-x:auto; margin:8px 0 0; max-height:220px; }
  .verdict{ font-size:14px; font-weight:700; padding:12px; border-radius:10px; margin-top:12px; }
  .hint{ font-size:12px; color:#64748b; margin-top:6px; }
  code{ background:#f1f5f9; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>GAS 疎通テスト</h1>
  <p class="lead">
    画面を GitHub Pages に置き、Apps Script をデータ用APIとして使う構成が成立するかを確かめます。
    ブラウザから Google 以外のドメイン経由で呼べるかどうか（CORS）がここで分かります。
  </p>

  <div class="card">
    <label for="url">ウェブアプリURL（末尾 /exec）</label>
    <input id="url" type="url" placeholder="https://script.google.com/macros/s/XXXX/exec" autocomplete="off">
    <label for="key">アクセスキー</label>
    <input id="key" type="text" placeholder="3ba84a..." autocomplete="off" spellcheck="false">
    <div class="row">
      <button id="run">テストを実行</button>
      <span class="hint" id="saved"></span>
    </div>
    <p class="hint">
      入力値はこのブラウザにだけ保存され、どこにも送信されません（テスト先のGASを除く）。
    </p>
  </div>

  <div id="out" class="res"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const LS = 'gasProbe';

/* 入力値の保存・復元（毎回打ち直さなくて済むように） */
try {
  const saved = JSON.parse(localStorage.getItem(LS) || '{}');
  if (saved.url) $('#url').value = saved.url;
  if (saved.key) $('#key').value = saved.key;
  if (saved.url) $('#saved').textContent = '前回の入力を復元しました';
} catch (e) {}

/* URLに ?url= / ?key= が付いていればそちらを優先 */
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get('url')) $('#url').value = q.get('url');
  if (q.get('key')) $('#key').value = q.get('key');
})();

function card(id, title) {
  const el = document.createElement('div');
  el.className = 't wait';
  el.id = id;
  el.innerHTML = '<b>⏳ ' + title + '</b><span class="msg">実行中…</span>';
  $('#out').appendChild(el);
  return el;
}

function done(el, ok, title, msg, data) {
  el.className = 't ' + (ok ? 'ok' : 'ng');
  el.innerHTML = '<b>' + (ok ? '✅ ' : '❌ ') + title + '</b>' +
    '<span class="msg">' + msg + '</span>' +
    (data ? '<pre>' + String(data).slice(0, 1200) + '</pre>' : '');
}

/* ① GET + fetch（CORS） */
async function testGet(base, key) {
  const el = card('t1', '① GET（fetch / CORS）');
  const t0 = Date.now();
  try {
    const u = base + (base.indexOf('?') < 0 ? '?' : '&') +
      'api=1&method=ping&key=' + encodeURIComponent(key);
    const res = await fetch(u, { method: 'GET' });
    const text = await res.text();
    let json = null;
    try { json = JSON.parse(text); } catch (e) {}
    if (json && json.ok) {
      done(el, true, '① GET（fetch / CORS）',
        'CORSを越えて読めました（' + (Date.now() - t0) + 'ms）。サーバー時刻 ' + (json.serverTime || '-'),
        JSON.stringify(json, null, 1));
      return true;
    }
    done(el, false, '① GET（fetch / CORS）',
      'HTTP ' + res.status + ' — JSONとして読めませんでした', text.slice(0, 600));
    return false;
  } catch (err) {
    done(el, false, '① GET（fetch / CORS）',
      'ブロックされました: ' + err.message + '（CORSでの読み取り不可）');
    return false;
  }
}

/* ② POST + fetch（text/plain なのでプリフライトなし） */
async function testPost(base, key) {
  const el = card('t2', '② POST（fetch / text-plain）');
  const t0 = Date.now();
  try {
    const res = await fetch(base, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ping: true, auth: key })
    });
    const text = await res.text();
    let json = null;
    try { json = JSON.parse(text); } catch (e) {}
    if (json && json.ok) {
      done(el, true, '② POST（fetch / text-plain）',
        '書き込み経路も通りました（' + (Date.now() - t0) + 'ms）', JSON.stringify(json, null, 1));
      return true;
    }
    done(el, false, '② POST（fetch / text-plain）',
      'HTTP ' + res.status + ' — JSONとして読めませんでした', text.slice(0, 600));
    return false;
  } catch (err) {
    done(el, false, '② POST（fetch / text-plain）', 'ブロックされました: ' + err.message);
    return false;
  }
}

/* ③ JSONP（CORSを使わない逃げ道。読み取り専用） */
function testJsonp(base, key) {
  const el = card('t3', '③ JSONP（CORS回避の代替手段）');
  const t0 = Date.now();
  return new Promise(resolve => {
    const cb = 'gasProbeCb' + Date.now().toString(36);
    let finished = false;
    const cleanup = () => { try { delete window[cb]; } catch (e) {} if (s.parentNode) s.remove(); };
    const timer = setTimeout(() => {
      if (finished) return;
      finished = true; cleanup();
      done(el, false, '③ JSONP（CORS回避の代替手段）', 'タイムアウト（15秒）— 応答がありませんでした');
      resolve(false);
    }, 15000);

    window[cb] = data => {
      if (finished) return;
      finished = true; clearTimeout(timer); cleanup();
      const ok = !!(data && data.ok);
      done(el, ok, '③ JSONP（CORS回避の代替手段）',
        ok ? 'JSONPで読めました（' + (Date.now() - t0) + 'ms）' : '応答はありましたが ok ではありません',
        JSON.stringify(data, null, 1));
      resolve(ok);
    };

    const s = document.createElement('script');
    s.src = base + (base.indexOf('?') < 0 ? '?' : '&') +
      'api=1&method=ping&key=' + encodeURIComponent(key) + '&callback=' + cb;
    s.onerror = () => {
      if (finished) return;
      finished = true; clearTimeout(timer); cleanup();
      done(el, false, '③ JSONP（CORS回避の代替手段）', 'スクリプトを読み込めませんでした');
      resolve(false);
    };
    document.head.appendChild(s);
  });
}

/* ④ 実データ（件数だけ取得して、本番データに届くかを確認） */
async function testData(base, key) {
  const el = card('t4', '④ 実データの取得（getSyncState）');
  const t0 = Date.now();
  try {
    const u = base + (base.indexOf('?') < 0 ? '?' : '&') +
      'api=1&method=getSyncState&args=' + encodeURIComponent('[]') +
      '&key=' + encodeURIComponent(key);
    const res = await fetch(u, { method: 'GET' });
    const json = JSON.parse(await res.text());
    if (json && json.ok) {
      done(el, true, '④ 実データの取得（getSyncState）',
        'タスク ' + (json.result ? json.result.count : '?') + ' 件（' + (Date.now() - t0) + 'ms）',
        JSON.stringify(json, null, 1));
      return true;
    }
    done(el, false, '④ 実データの取得（getSyncState）',
      json && json.error ? json.error : '取得できませんでした', JSON.stringify(json, null, 1));
    return false;
  } catch (err) {
    done(el, false, '④ 実データの取得（getSyncState）', err.message);
    return false;
  }
}

$('#run').onclick = async () => {
  let base = $('#url').value.trim();
  const key = $('#key').value.trim();
  $('#out').innerHTML = '';
  $('#saved').textContent = '';

  if (!/^https:\/\/script\.google\.com\/.*\/exec/.test(base)) {
    $('#out').innerHTML = '<div class="t ng"><b>❌ URLを確認してください</b>' +
      '<span class="msg">末尾が <code>/exec</code> の本番URLを入れてください。' +
      '<code>/dev</code> や <code>/a/ドメイン/</code> が入っていると動きません。</span></div>';
    return;
  }
  if (!key) {
    $('#out').innerHTML = '<div class="t ng"><b>❌ アクセスキーを入れてください</b>' +
      '<span class="msg">キーが無いと共有モードでは弾かれます。</span></div>';
    return;
  }
  base = base.split('#')[0];
  try { localStorage.setItem(LS, JSON.stringify({ url: base, key: key })); } catch (e) {}

  $('#run').disabled = true;
  const r1 = await testGet(base, key);
  const r2 = await testPost(base, key);
  const r3 = await testJsonp(base, key);
  const r4 = r1 ? await testData(base, key) : false;
  $('#run').disabled = false;

  const v = document.createElement('div');
  v.className = 'verdict ' + ((r1 && r2) ? 'ok' : (r3 ? 'wait' : 'ng'));
  if (r1 && r2) {
    v.innerHTML = '🎉 この構成で進められます。<br>' +
      '<span class="msg">読み書きともにCORSを越えられました。' +
      '画面をこの静的ホストに置き、GASをAPIとして使う形に移行できます。</span>';
  } else if (r3) {
    v.innerHTML = '△ 読み取りはJSONPで可能、書き込みは要検討。<br>' +
      '<span class="msg">fetchがブロックされましたが、JSONPは通りました。' +
      '読み取りはJSONP、書き込みは別の手当てが必要です。この結果を貼ってください。</span>';
  } else {
    v.innerHTML = '✕ この構成は成立しません。<br>' +
      '<span class="msg">どの経路も通りませんでした。' +
      'デプロイの「アクセスできるユーザー」が「全員」になっているか確認し、' +
      'それでも同じならこの結果を貼ってください。別の方式を考えます。</span>';
  }
  $('#out').appendChild(v);
};
</script>
</body>
</html>
