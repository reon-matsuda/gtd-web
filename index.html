<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAS 疎通テスト</title>
<style>
  :root{ color-scheme: light; }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:16px; background:#f4f5f7; color:#1e293b;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:14px; line-height:1.7; }
  .wrap{ max-width:760px; margin:0 auto; }
  h1{ font-size:18px; margin:0 0 4px; }
  .lead{ color:#64748b; font-size:13px; margin:0 0 16px; }
  .card{ background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px; }
  input{ width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:9px 10px; font-size:13px;
    background:#fff; margin-bottom:10px; }
  button{ border:0; border-radius:8px; padding:11px 16px; font-size:14px; font-weight:600;
    background:#4f46e5; color:#fff; cursor:pointer; }
  button:disabled{ background:#c7d2fe; cursor:default; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .res{ margin-top:12px; }
  .t{ border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .t b{ display:block; font-size:13px; margin-bottom:2px; }
  .ok{ border-color:#86efac; background:#f0fdf4; }
  .ng{ border-color:#fca5a5; background:#fef2f2; }
  .wait{ border-color:#fcd34d; background:#fffbeb; }
  .msg{ font-size:12px; color:#475569; word-break:break-all; }
  pre{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px;
    font-size:11px; overflow-x:auto; margin:8px 0 0; max-height:200px; }
  .verdict{ font-size:14px; font-weight:700; padding:12px; border-radius:10px; margin-top:12px; }
  .hint{ font-size:12px; color:#64748b; margin-top:6px; }
  code{ background:#f1f5f9; padding:1px 5px; border-radius:4px; font-size:12px; }
  .ver{ font-size:11px; color:#94a3b8; margin-top:14px; text-align:right; }
  table.probe{ width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;
    font-variant-numeric:tabular-nums; }
  table.probe th, table.probe td{ border-bottom:1px solid #e2e8f0; padding:4px 6px; text-align:right; }
  table.probe th{ color:#64748b; font-weight:600; font-size:11px; }
  table.probe td:last-child, table.probe th:last-child{ text-align:left; }
  .big{ font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .copybox{ width:100%; min-height:120px; font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px; border:1px solid #cbd5e1; border-radius:8px; padding:8px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>GAS 疎通テスト <span style="font-size:12px;color:#94a3b8;font-weight:400;">v3</span></h1>
  <p class="lead">
    POST本文の<b>上限サイズを自動で探します</b>。小さいPOSTから始めて倍々に増やし、
    届かなくなった境目を二分探索で詰めます。10回ほど通信します。
  </p>

  <div class="card">
    <label for="url">テスト用スクリプトのURL（末尾 /exec）</label>
    <input id="url" type="url" placeholder="https://script.google.com/macros/s/XXXX/exec" autocomplete="off">
    <label for="key">キー</label>
    <input id="key" type="text" placeholder="testkey123" autocomplete="off" spellcheck="false">
    <div class="row">
      <button id="run">テストを実行</button>
      <span class="hint" id="saved"></span>
    </div>
    <p class="hint">
      入力値はこのブラウザにだけ保存され、どこにも送信されません（テスト先のGASを除く）。
    </p>
  </div>

  <div id="out" class="res"></div>
  <p class="ver">v3 — POST本文の上限を二分探索で特定</p>
</div>

<script>
const $ = s => document.querySelector(s);
const LS = 'gasProbe';

try {
  const saved = JSON.parse(localStorage.getItem(LS) || '{}');
  if (saved.url) $('#url').value = saved.url;
  if (saved.key) $('#key').value = saved.key;
  if (saved.url) $('#saved').textContent = '前回の入力を復元しました';
} catch (e) {}
if (!$('#key').value) $('#key').value = 'testkey123';

(function () {
  const q = new URLSearchParams(location.search);
  if (q.get('url')) $('#url').value = q.get('url');
  if (q.get('key')) $('#key').value = q.get('key');
})();

function card(id, title) {
  const el = document.createElement('div');
  el.className = 't wait';
  el.id = id;
  el.innerHTML = '<b>⏳ ' + title + '</b><span class="msg">実行中…</span>';
  $('#out').appendChild(el);
  return el;
}
function done(el, ok, title, msg, extraHtml) {
  el.className = 't ' + (ok ? 'ok' : 'ng');
  el.innerHTML = '<b>' + (ok ? '✅ ' : '❌ ') + title + '</b>' +
    '<span class="msg">' + msg + '</span>' + (extraHtml || '');
}
const kb = n => (n / 1024).toFixed(1) + 'KB';

/* text/plain にしておくとプリフライト（事前確認の通信）が起きない */
async function post(base, body) {
  const res = await fetch(base, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const text = await res.text();
  let json = null;
  try { json = JSON.parse(text); } catch (e) {}
  return { res, text, json };
}

/* ① GET（CORSを越えて読めるか） */
async function testGet(base, key) {
  const el = card('t1', '① GET（fetch / CORS）');
  const t0 = Date.now();
  try {
    const u = base + (base.indexOf('?') < 0 ? '?' : '&') +
      'api=1&method=ping&key=' + encodeURIComponent(key);
    const res = await fetch(u, { method: 'GET' });
    const json = JSON.parse(await res.text());
    if (json && json.ok) {
      done(el, true, '① GET（fetch / CORS）',
        '読めました（' + (Date.now() - t0) + 'ms）／サーバー時刻 ' + (json.serverTime || '-'));
      return true;
    }
    done(el, false, '① GET（fetch / CORS）', 'HTTP ' + res.status + ' — 読めませんでした');
    return false;
  } catch (err) {
    done(el, false, '① GET（fetch / CORS）', 'ブロックされました: ' + err.message);
    return false;
  }
}

/* 指定バイト数の本文をPOSTして、POSTのまま全部届いたかを返す */
async function probeSize(base, key, n) {
  const skeleton = JSON.stringify({ ping: true, auth: key, pad: '' });
  const pad = 'x'.repeat(Math.max(0, n - skeleton.length));
  const body = { ping: true, auth: key, pad: pad };
  const sent = JSON.stringify(body).length;
  try {
    const { json } = await post(base, body);
    const via = json ? String(json.via || '?') : '(応答なし)';
    const got = json ? Number(json.bytes || 0) : -1;
    const ok = !!(json && json.ok && via === 'POST' && got >= sent * 0.9);
    return { ok, sent, got, via };
  } catch (err) {
    return { ok: false, sent, got: -1, via: 'エラー: ' + err.message };
  }
}

/* ② POST（小）— まずPOSTが成立することを確認 */
async function testPostSmall(base, key) {
  const el = card('t2', '② 小さいPOSTが POST のまま届くか');
  const r = await probeSize(base, key, 200);
  if (r.ok) {
    done(el, true, '② 小さいPOSTが POST のまま届くか',
      'via=POST ／ 送信 ' + r.sent + ' → 受信 ' + r.got + ' バイト');
    return true;
  }
  done(el, false, '② 小さいPOSTが POST のまま届くか',
    'via=' + r.via + ' ／ 送信 ' + r.sent + ' → 受信 ' + r.got + ' バイト');
  return false;
}

/* ③ 上限の特定：倍々で増やして失敗地点を見つけ、そこを二分探索で詰める */
async function findLimit(base, key) {
  const el = card('t3', '③ POST本文の上限を探索中');
  const rows = [];
  const render = (extra) => {
    let html = '<table class="probe"><tr><th>試したサイズ</th><th>受信</th>' +
      '<th>via</th><th>結果</th></tr>';
    rows.forEach(r => {
      html += '<tr><td>' + kb(r.sent) + '</td><td>' + (r.got < 0 ? '—' : kb(r.got)) +
        '</td><td>' + r.via + '</td><td>' + (r.ok ? '✅ 到達' : '❌ 欠落') + '</td></tr>';
    });
    html += '</table>' + (extra || '');
    el.innerHTML = '<b>' + (extra ? '' : '⏳ ') + '③ POST本文の上限を探索</b>' +
      '<span class="msg">小さい方から倍々に増やし、失敗した区間を二分探索で詰めます。</span>' + html;
  };

  let lo = 0, hi = 0;
  for (const n of [4096, 8192, 16384, 32768, 65536, 131072]) {
    const r = await probeSize(base, key, n);
    rows.push(r); render();
    if (r.ok) lo = r.sent; else { hi = r.sent; break; }
  }

  if (!hi) {
    el.className = 't ok';
    render('<p class="msg" style="margin-top:8px;">128KBまで全部通りました。実用上の上限は見つかりません。</p>');
    return { limit: lo, capped: true };
  }

  for (let i = 0; i < 8 && hi - lo > 512; i++) {
    const mid = Math.floor((lo + hi) / 2);
    const r = await probeSize(base, key, mid);
    rows.push(r); render();
    if (r.ok) lo = r.sent; else hi = r.sent;
  }

  el.className = 't ok';
  render('<p class="msg" style="margin-top:8px;">' +
    '通った最大 <b>' + kb(lo) + '</b>（' + lo + ' バイト）／ 落ちた最小 <b>' + kb(hi) + '</b>' +
    '</p>');
  return { limit: lo, upper: hi, capped: false };
}

/* ④ POST経由でメソッドを呼ぶ（本番と同じ形） */
async function testRpc(base, key) {
  const el = card('t4', '④ POSTでメソッド呼び出し（getSyncState）');
  const t0 = Date.now();
  try {
    const { res, json } = await post(base, { method: 'getSyncState', args: [], auth: key });
    if (json && json.ok) {
      done(el, true, '④ POSTでメソッド呼び出し（getSyncState）',
        '結果 ' + JSON.stringify(json.result) + '（' + (Date.now() - t0) + 'ms）');
      return true;
    }
    done(el, false, '④ POSTでメソッド呼び出し（getSyncState）',
      (json && json.error) ? json.error : ('HTTP ' + res.status));
    return false;
  } catch (err) {
    done(el, false, '④ POSTでメソッド呼び出し（getSyncState）', err.message);
    return false;
  }
}

$('#run').onclick = async () => {
  let base = $('#url').value.trim();
  const key = $('#key').value.trim();
  $('#out').innerHTML = '';
  $('#saved').textContent = '';

  if (!/^https:\/\/script\.google\.com\/.*\/exec/.test(base)) {
    $('#out').innerHTML = '<div class="t ng"><b>❌ URLを確認してください</b>' +
      '<span class="msg">末尾が <code>/exec</code> のURLを入れてください。</span></div>';
    return;
  }
  if (!key) {
    $('#out').innerHTML = '<div class="t ng"><b>❌ キーを入れてください</b>' +
      '<span class="msg">テスト用スクリプトの <code>TEST_KEY</code> と同じ文字列です。</span></div>';
    return;
  }
  base = base.split('#')[0];
  try { localStorage.setItem(LS, JSON.stringify({ url: base, key: key })); } catch (e) {}

  $('#run').disabled = true;
  const r1 = await testGet(base, key);
  const r2 = r1 ? await testPostSmall(base, key) : false;
  const lim = r2 ? await findLimit(base, key) : null;
  const r4 = r2 ? await testRpc(base, key) : false;
  $('#run').disabled = false;

  const v = document.createElement('div');
  if (r1 && r2 && lim && r4) {
    const safe = Math.floor(lim.limit / 2 / 1024) * 1024;
    v.className = 'verdict ok';
    v.innerHTML = '🎉 この構成で進められます。<br>' +
      '<span class="msg">読み書きともに成立。POST本文は ' +
      (lim.capped ? '<b>128KB以上</b>まで通りました' : '<b>' + kb(lim.limit) + '</b>まで通りました') +
      '。1回あたり <b>' + kb(safe) + '</b> ずつに分けて送る設計にします。</span>';
  } else if (r1 && r2) {
    v.className = 'verdict wait';
    v.innerHTML = '△ POSTは通るが、一部が失敗。<br>' +
      '<span class="msg">下の結果を貼ってください。</span>';
  } else if (r1) {
    v.className = 'verdict wait';
    v.innerHTML = '△ 読み取りのみ成功。<br>' +
      '<span class="msg">POSTが届きませんでした。結果を貼ってください。</span>';
  } else {
    v.className = 'verdict ng';
    v.innerHTML = '✕ 読み取りも通りませんでした。<br>' +
      '<span class="msg">デプロイの「アクセスできるユーザー」が「全員」か確認してください。</span>';
  }
  $('#out').appendChild(v);

  /* 報告用にまとめてコピーできるようにする */
  const sum = document.createElement('div');
  sum.className = 'card';
  sum.innerHTML = '<label>この内容をそのまま貼ってください</label>' +
    '<textarea class="copybox" readonly id="sumbox"></textarea>';
  $('#out').appendChild(sum);
  $('#sumbox').value = [
    '端末: ' + navigator.userAgent,
    '① GET: ' + (r1 ? 'OK' : 'NG'),
    '② 小POST: ' + (r2 ? 'OK (via=POST)' : 'NG'),
    '③ 上限: ' + (lim ? (lim.capped ? '128KB以上（未検出）'
      : lim.limit + ' バイトまで到達 / ' + lim.upper + ' バイトで欠落') : '未実施'),
    '④ メソッド呼び出し: ' + (r4 ? 'OK' : 'NG')
  ].join('\n');
};
</script>
</body>
</html>
