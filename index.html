<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAS 疎通テスト</title>
<style>
  :root{ color-scheme: light; }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:16px; background:#f4f5f7; color:#1e293b;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:14px; line-height:1.7; }
  .wrap{ max-width:760px; margin:0 auto; }
  h1{ font-size:18px; margin:0 0 4px; }
  .lead{ color:#64748b; font-size:13px; margin:0 0 16px; }
  .card{ background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px; }
  input{ width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:9px 10px; font-size:13px;
    background:#fff; margin-bottom:10px; }
  button{ border:0; border-radius:8px; padding:11px 16px; font-size:14px; font-weight:600;
    background:#4f46e5; color:#fff; cursor:pointer; }
  button:disabled{ background:#c7d2fe; cursor:default; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .res{ margin-top:12px; }
  .t{ border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .t b{ display:block; font-size:13px; margin-bottom:2px; }
  .ok{ border-color:#86efac; background:#f0fdf4; }
  .ng{ border-color:#fca5a5; background:#fef2f2; }
  .wait{ border-color:#fcd34d; background:#fffbeb; }
  .msg{ font-size:12px; color:#475569; word-break:break-all; }
  pre{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px;
    font-size:11px; overflow-x:auto; margin:8px 0 0; max-height:200px; }
  .verdict{ font-size:14px; font-weight:700; padding:12px; border-radius:10px; margin-top:12px; }
  .hint{ font-size:12px; color:#64748b; margin-top:6px; }
  code{ background:#f1f5f9; padding:1px 5px; border-radius:4px; font-size:12px; }
  .ver{ font-size:11px; color:#94a3b8; margin-top:14px; text-align:right; }
</style>
</head>
<body>
<div class="wrap">
  <h1>GAS 疎通テスト <span style="font-size:12px;color:#94a3b8;font-weight:400;">v2</span></h1>
  <p class="lead">
    画面を GitHub Pages に置き、Apps Script をデータ用APIとして使う構成が成立するかを確かめます。
    とくに <b>POST が POST のまま届くか</b>（リダイレクトでGETに降格しないか）を判定します。
  </p>

  <div class="card">
    <label for="url">テスト用スクリプトのURL（末尾 /exec）</label>
    <input id="url" type="url" placeholder="https://script.google.com/macros/s/XXXX/exec" autocomplete="off">
    <label for="key">キー</label>
    <input id="key" type="text" placeholder="testkey123" autocomplete="off" spellcheck="false">
    <div class="row">
      <button id="run">テストを実行</button>
      <span class="hint" id="saved"></span>
    </div>
    <p class="hint">
      入力値はこのブラウザにだけ保存され、どこにも送信されません（テスト先のGASを除く）。
    </p>
  </div>

  <div id="out" class="res"></div>
  <p class="ver">v2 — POST降格の検出と大きい本文の試験を追加</p>
</div>

<script>
const $ = s => document.querySelector(s);
const LS = 'gasProbe';

/* 入力値の保存・復元 */
try {
  const saved = JSON.parse(localStorage.getItem(LS) || '{}');
  if (saved.url) $('#url').value = saved.url;
  if (saved.key) $('#key').value = saved.key;
  if (saved.url) $('#saved').textContent = '前回の入力を復元しました';
} catch (e) {}
if (!$('#key').value) $('#key').value = 'testkey123';

/* URLに ?url= / ?key= が付いていればそちらを優先 */
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get('url')) $('#url').value = q.get('url');
  if (q.get('key')) $('#key').value = q.get('key');
})();

function card(id, title) {
  const el = document.createElement('div');
  el.className = 't wait';
  el.id = id;
  el.innerHTML = '<b>⏳ ' + title + '</b><span class="msg">実行中…</span>';
  $('#out').appendChild(el);
  return el;
}

function done(el, ok, title, msg, data) {
  el.className = 't ' + (ok ? 'ok' : 'ng');
  el.innerHTML = '<b>' + (ok ? '✅ ' : '❌ ') + title + '</b>' +
    '<span class="msg">' + msg + '</span>' +
    (data ? '<pre>' + String(data).slice(0, 1000) + '</pre>' : '');
}

/* 共通：POSTしてJSONを返す（text/plain なのでプリフライトなし） */
async function post(base, body) {
  const res = await fetch(base, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const text = await res.text();
  let json = null;
  try { json = JSON.parse(text); } catch (e) {}
  return { res, text, json };
}

/* ① GET + fetch（CORSを越えて読めるか） */
async function testGet(base, key) {
  const el = card('t1', '① GET（fetch / CORS）');
  const t0 = Date.now();
  try {
    const u = base + (base.indexOf('?') < 0 ? '?' : '&') +
      'api=1&method=ping&key=' + encodeURIComponent(key);
    const res = await fetch(u, { method: 'GET' });
    const text = await res.text();
    let json = null;
    try { json = JSON.parse(text); } catch (e) {}
    if (json && json.ok) {
      done(el, true, '① GET（fetch / CORS）',
        'CORSを越えて読めました（' + (Date.now() - t0) + 'ms）。サーバー時刻 ' + (json.serverTime || '-'),
        JSON.stringify(json, null, 1));
      return true;
    }
    done(el, false, '① GET（fetch / CORS）',
      'HTTP ' + res.status + ' — JSONとして読めませんでした', text.slice(0, 600));
    return false;
  } catch (err) {
    done(el, false, '① GET（fetch / CORS）',
      'ブロックされました: ' + err.message + '（CORSでの読み取り不可）');
    return false;
  }
}

/* ② POST（小）— ここが本題。via が POST でなければ降格している */
async function testPostSmall(base, key) {
  const el = card('t2', '② POST が POST のまま届くか');
  const t0 = Date.now();
  try {
    const { res, text, json } = await post(base, { ping: true, auth: key });
    if (!json || !json.ok) {
      done(el, false, '② POST が POST のまま届くか',
        'HTTP ' + res.status + ' — JSONとして読めませんでした', text.slice(0, 600));
      return 'fail';
    }
    if (json.via === 'POST') {
      done(el, true, '② POST が POST のまま届くか',
        'POSTのまま doPost に届きました（' + (Date.now() - t0) + 'ms）',
        JSON.stringify(json, null, 1));
      return 'post';
    }
    done(el, false, '② POST が POST のまま届くか',
      '応答はありましたが via=' + (json.via || '不明') +
      ' — リダイレクトでGETに降格しています', JSON.stringify(json, null, 1));
    return 'downgraded';
  } catch (err) {
    done(el, false, '② POST が POST のまま届くか', 'ブロックされました: ' + err.message);
    return 'fail';
  }
}

/* ③ POST（大）— まとめ書き（applyBatch）に耐えるか */
async function testPostLarge(base, key) {
  const SIZE = 120000;
  const el = card('t3', '③ 大きい本文のPOST（約120KB）');
  const t0 = Date.now();
  try {
    const body = { ping: true, auth: key, pad: 'x'.repeat(SIZE) };
    const sent = JSON.stringify(body).length;
    const { res, text, json } = await post(base, body);
    if (!json || !json.ok) {
      done(el, false, '③ 大きい本文のPOST（約120KB）',
        'HTTP ' + res.status + ' — 応答を読めませんでした（送信 ' + sent + ' バイト）',
        text.slice(0, 600));
      return false;
    }
    if (json.via !== 'POST') {
      done(el, false, '③ 大きい本文のPOST（約120KB）',
        'via=' + (json.via || '不明') + ' — 本文が失われています', JSON.stringify(json, null, 1));
      return false;
    }
    const got = Number(json.bytes || 0);
    const ok = got >= sent * 0.9;
    done(el, ok, '③ 大きい本文のPOST（約120KB）',
      (ok ? '欠けずに届きました' : '届いた本文が短くなっています') +
      '（送信 ' + sent + ' → 受信 ' + got + ' バイト / ' + (Date.now() - t0) + 'ms）',
      JSON.stringify(Object.assign({}, json, { pad: undefined }), null, 1));
    return ok;
  } catch (err) {
    done(el, false, '③ 大きい本文のPOST（約120KB）', 'ブロックされました: ' + err.message);
    return false;
  }
}

/* ④ POST経由でメソッドを呼ぶ（本番と同じ形） */
async function testRpc(base, key) {
  const el = card('t4', '④ POSTでメソッド呼び出し（getSyncState）');
  const t0 = Date.now();
  try {
    const { res, text, json } = await post(base, { method: 'getSyncState', args: [], auth: key });
    if (json && json.ok) {
      done(el, true, '④ POSTでメソッド呼び出し（getSyncState）',
        '結果 ' + JSON.stringify(json.result) + '（' + (Date.now() - t0) + 'ms）',
        JSON.stringify(json, null, 1));
      return true;
    }
    done(el, false, '④ POSTでメソッド呼び出し（getSyncState）',
      (json && json.error) ? json.error : ('HTTP ' + res.status + ' — 読めませんでした'),
      (text || '').slice(0, 600));
    return false;
  } catch (err) {
    done(el, false, '④ POSTでメソッド呼び出し（getSyncState）', err.message);
    return false;
  }
}

$('#run').onclick = async () => {
  let base = $('#url').value.trim();
  const key = $('#key').value.trim();
  $('#out').innerHTML = '';
  $('#saved').textContent = '';

  if (!/^https:\/\/script\.google\.com\/.*\/exec/.test(base)) {
    $('#out').innerHTML = '<div class="t ng"><b>❌ URLを確認してください</b>' +
      '<span class="msg">末尾が <code>/exec</code> のURLを入れてください。' +
      '<code>/dev</code> や <code>/a/ドメイン/</code> が入っていると動きません。</span></div>';
    return;
  }
  if (!key) {
    $('#out').innerHTML = '<div class="t ng"><b>❌ キーを入れてください</b>' +
      '<span class="msg">テスト用スクリプトの <code>TEST_KEY</code> と同じ文字列です。</span></div>';
    return;
  }
  base = base.split('#')[0];
  try { localStorage.setItem(LS, JSON.stringify({ url: base, key: key })); } catch (e) {}

  $('#run').disabled = true;
  const r1 = await testGet(base, key);
  const r2 = await testPostSmall(base, key);
  const r3 = (r2 === 'post') ? await testPostLarge(base, key) : false;
  const r4 = (r2 === 'post') ? await testRpc(base, key) : false;
  $('#run').disabled = false;

  const v = document.createElement('div');
  if (r1 && r2 === 'post' && r3 && r4) {
    v.className = 'verdict ok';
    v.innerHTML = '🎉 POST方式で進められます。<br>' +
      '<span class="msg">読み書きともに通り、まとめ書きに必要な本文量も運べました。' +
      'アクセスキーをURLに出さない設計にできます。</span>';
  } else if (r1 && r2 === 'post') {
    v.className = 'verdict wait';
    v.innerHTML = '△ POSTは通るが、一部に制限あり。<br>' +
      '<span class="msg">③か④が失敗しました。まとめ書きの分割などで回避できる見込みです。' +
      'この結果を貼ってください。</span>';
  } else if (r1 && r2 === 'downgraded') {
    v.className = 'verdict wait';
    v.innerHTML = '△ POSTがGETに降格しています。<br>' +
      '<span class="msg">読み取りは可能ですが、書き込みはURLに載せる方式になり、' +
      '一度に送れる量に上限が出ます。設計を調整します。この結果を貼ってください。</span>';
  } else if (r1) {
    v.className = 'verdict wait';
    v.innerHTML = '△ 読み取りのみ成功。<br>' +
      '<span class="msg">POSTが届きませんでした。この結果を貼ってください。</span>';
  } else {
    v.className = 'verdict ng';
    v.innerHTML = '✕ この構成は成立しません。<br>' +
      '<span class="msg">読み取りも通りませんでした。デプロイの「アクセスできるユーザー」が' +
      '「全員」になっているか確認し、それでも同じならこの結果を貼ってください。</span>';
  }
  $('#out').appendChild(v);
};
</script>
</body>
</html>
